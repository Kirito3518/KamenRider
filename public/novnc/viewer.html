<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin VNC viewer</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      html, body { width: 100%; height: 100%; margin: 0; background: #111827; color: #e5e7eb; }
      body { display: flex; flex-direction: column; }
      #status { min-height: 2rem; padding: .6rem 1rem; font-size: .875rem; }
      #screen { flex: 1; min-height: 0; overflow: auto; }
      #screen canvas { display: block; margin: auto; }
    </style>
  </head>
  <body>
    <p id="status" role="status" aria-live="polite">กำลังเตรียมการเชื่อมต่อ…</p>
    <div id="screen" aria-label="หน้าจอเครื่องลูก"></div>
    <script type="module">
      import RFB from "./core/rfb.js";

      // This viewer never negotiates clipboard support or sends ClientCutText.
      const extendedClipboardPseudoEncoding = 0xc0a1e5ce;
      const sendClientEncodings = RFB.messages.clientEncodings;
      RFB.messages.clientEncodings = (sock, encodings) =>
        sendClientEncodings(sock, encodings.filter((encoding) => encoding !== extendedClipboardPseudoEncoding));
      RFB.messages.extendedClipboardCaps = () => {};

      const status = document.getElementById("status");
      const screen = document.getElementById("screen");
      // The managed TightVNC install uses this reviewed value and the Agent never exposes it
      // outside the local private data directory. VNC is source-restricted to the Mother and
      // reachable only through the authenticated admin gateway, so the viewer authenticates
      // automatically instead of asking the administrator every time.
      const managedVncPassword = "KamenVNC";
      let rfb = null;
      let started = false;

      function setStatus(message) {
        status.textContent = message;
        window.parent.postMessage({ type: "kr-vnc-status", message }, window.location.origin);
      }

      window.addEventListener("message", (event) => {
        if (event.origin !== window.location.origin || event.source !== window.parent) return;
        if (event.data?.type !== "kr-vnc-connect" || started) return;
        const { webSocketUrl, ticket } = event.data;
        if (typeof ticket !== "string" || !/^[A-Za-z0-9_-]{43}$/.test(ticket)) return;
        let socketUrl;
        try { socketUrl = new URL(webSocketUrl); } catch { return; }
        if (socketUrl.protocol !== "wss:" || socketUrl.pathname !== "/admin/vnc" || socketUrl.search || socketUrl.hash) return;

        started = true;
        try {
          rfb = new RFB(screen, socketUrl.toString(), { wsProtocols: ["binary", `kamen-vnc-${ticket}`] });
          rfb.viewOnly = true;
          rfb.scaleViewport = true;
          rfb.clipViewport = true;
          rfb.addEventListener("connect", () => setStatus("เชื่อมต่อแล้ว · โหมดดูอย่างเดียว"));
          rfb.addEventListener("disconnect", (event) => setStatus(event.detail?.clean ? "ปิดการเชื่อมต่อแล้ว" : "การเชื่อมต่อขาด"));
          rfb.addEventListener("credentialsrequired", () => {
            rfb.sendCredentials({ password: managedVncPassword });
          });
          rfb.addEventListener("securityfailure", () => setStatus("VNC ปฏิเสธการยืนยันตัวตน"));
        } catch {
          setStatus("เริ่ม viewer ไม่สำเร็จ");
        }
      });

      window.addEventListener("beforeunload", () => { if (rfb) rfb.disconnect(); });
      window.parent.postMessage({ type: "kr-vnc-ready" }, window.location.origin);
    </script>
  </body>
</html>
